# Example template for the application's env-var Secret.
#
# DO NOT commit this file with real values. Generate the required runtime
# secrets and either:
#   (a) `kubectl apply -f` directly (manual rotation each time), or
#   (b) Encrypt with SOPS / sealed-secrets / external-secrets-operator and
#       commit the encrypted form.
#
# Generate the required values (the three at the top); leave the rest as
# empty strings until you're ready to wire in the integration:
#
#   openssl rand -base64 32   → DB_PASSWORD
#   openssl rand -base64 48   → JWT_SECRET
#   openssl rand -hex 32      → BROKER_ENCRYPTION_KEY
#
# Note: leave EMAIL_PORT OUT entirely (don't include it as an empty string).
# The app's joi env validator types it as `.number()` and rejects empty
# strings. Add it as a real port (e.g. "587") only when configuring SMTP.

apiVersion: v1
kind: Secret
metadata:
  name: tradetally-secrets
  namespace: tradetally
type: Opaque
stringData:
  # Required runtime secrets (generate with openssl per comments above)
  DB_PASSWORD: "CHANGE_ME_openssl_rand_base64_32"
  JWT_SECRET: "CHANGE_ME_openssl_rand_base64_48"
  BROKER_ENCRYPTION_KEY: "CHANGE_ME_openssl_rand_hex_32"

  # External market-data APIs — fill in if/when you have keys
  FINNHUB_API_KEY: ""
  ALPHA_VANTAGE_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENFIGI_API_KEY: ""
  ALPACA_API_KEY_ID: ""
  ALPACA_API_SECRET_KEY: ""
  DATABENTO_API_KEY: ""
  COINGECKO_API_KEY: ""

  # Schwab broker OAuth — fill in after registering at developer.schwab.com
  SCHWAB_CLIENT_ID: ""
  SCHWAB_CLIENT_SECRET: ""

  # Stripe billing — deferred
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # Apple IAP — deferred
  APPLE_SHARED_SECRET: ""
  APPLE_APP_ID: ""
  APPLE_BUNDLE_ID: ""

  # APNS push — deferred
  APNS_KEY_ID: ""
  APNS_TEAM_ID: ""

  # Email / SMTP — deferred. NOTE: do NOT include EMAIL_PORT as an empty
  # string (the joi env validator types it as number; empty string fails).
  # Add EMAIL_PORT: "587" (or your provider's port) when wiring SMTP.
  EMAIL_HOST: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  EMAIL_FROM: ""
  DKIM_PRIVATE_KEY: ""
  DKIM_SELECTOR: ""
