apiVersion: v1
kind: ConfigMap
metadata:
  name: tradetally-config
  namespace: tradetally
data:
  # Backend port — MUST be 3000 because nginx in the image hardcodes
  # proxy_pass to localhost:3000 (see docker/nginx.conf). The app's joi
  # default is 5001 which would silently break nginx → backend routing.
  PORT: "3000"

  # Identity
  NODE_ENV: production
  INSTANCE_NAME: "TradeTally (homelab)"
  INSTANCE_URL: "https://tradetally.example.com"
  APP_URL: "https://tradetally.example.com"
  BASE_URL: "https://tradetally.example.com"
  FRONTEND_URL: "https://tradetally.example.com"
  SUPPORT_EMAIL: "admin@example.com"

  # Database connection (password from Secret)
  DB_HOST: tradetally-db
  DB_PORT: "5432"
  DB_USER: trader
  DB_NAME: tradetally
  DB_POOL_SIZE: "25"
  DB_CONNECTION_TIMEOUT: "5000"
  DB_STATEMENT_TIMEOUT: "30000"

  # Auth + session
  JWT_EXPIRES_IN: 7d
  JWT_EXPIRE: 7d
  ACCESS_TOKEN_EXPIRE: 15m
  REFRESH_TOKEN_EXPIRE: 30d
  MAX_DEVICES_PER_USER: "10"
  ENABLE_DEVICE_TRACKING: "true"

  # OAuth2 server signing-key file paths (key files mounted from tradetally-oauth-keys Secret)
  OAUTH_PRIVATE_KEY_PATH: /app/backend/src/data/keys/oauth-private.pem
  OAUTH_PUBLIC_KEY_PATH: /app/backend/src/data/keys/oauth-public.pem

  # Behavior
  REGISTRATION_MODE: closed
  TZ: America/New_York
  TRUST_PROXY: "1"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX: "1000"
  RATE_LIMIT_WINDOW_MS: "900000"
  MAX_FILE_SIZE: "52428800"
  LOG_LEVEL: INFO

  # Feature toggles
  BILLING_ENABLED: "false"
  FEATURES_BILLING_ENABLED: "false"
  ENABLE_PUSH_NOTIFICATIONS: "false"
  ENABLE_BACKUP_SCHEDULER: "false"
  ENABLE_V1_WEBHOOKS: "false"

  # Documentation
  ENABLE_SWAGGER: "true"

  # WebAuthn / passkeys — RP_ID MUST match the origin hostname forever; changing it
  # invalidates every registered passkey (browser refuses cross-RP credentials)
  WEBAUTHN_RP_ID: tradetally.example.com
  WEBAUTHN_RP_NAME: "TradeTally (homelab)"

  # Schwab OAuth callback URL (set early so the redirect path is stable;
  # client_id/secret come from the Secret when filled in)
  SCHWAB_REDIRECT_URI: "https://tradetally.example.com/api/broker-sync/connections/schwab/callback"
