apiVersion: v1
kind: Service
metadata:
  name: tradetally-db
  namespace: tradetally
spec:
  clusterIP: None                         # headless — stable DNS via StatefulSet
  publishNotReadyAddresses: true          # let app DNS resolve during pg init
  selector:
    app: tradetally-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
