apiVersion: v1
kind: ConfigMap
metadata:
  name: tradetally-postgres-config
  namespace: tradetally
data:
  postgresql.conf: |
    # Homelab tuning — matches 1Gi pod limit + 25-conn app pool
    listen_addresses = '*'

    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 768MB
    work_mem = 8MB
    maintenance_work_mem = 128MB

    wal_compression = on
    checkpoint_timeout = 15min

    # SSD-class storage
    random_page_cost = 1.1

    # Free query observability (Grafana follow-up)
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 1000
    pg_stat_statements.track = all

    # Log slow queries and checkpoints
    log_min_duration_statement = 1000
    log_checkpoints = on
